<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Business Card</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="business-card">
      <div class="card-header">
        <div class="profile-image-wrapper">
          <img
            src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg"
            alt="Profil fotoğrafı"
            class="profile-image"
          />
        </div>
        <p class="full-name">Alpay Acar</p>
        <p class="designation">Yazılım Geliştirici</p>
        <p class="company">@freeCodeCamp</p>
      </div>

      <div class="card-contact">
        <div class="contact-row">
          <i class="ti ti-mail"></i>
          <a href="mailto:alpayacr@hotmail.com">alpayacr@hotmail.com</a>
        </div>
        <div class="contact-row">
          <i class="ti ti-phone"></i>
          <a href="tel:+905541993004">0554 199 30 04</a>
        </div>
        <div class="contact-row">
          <i class="ti ti-briefcase"></i>
          <a href="https://github.com/">Portfolio →</a>
        </div>
      </div>

      <div class="card-social">
        <p class="social-title">Bağlantılar</p>
        <a href="https://github.com/alpayacr0" class="social-link">
          <i class="ti ti-brand-github"></i>
          <span>GitHub</span>
        </a>
        <a
          href="https://www.linkedin.com/in/alpay-acar-823b21196/"
          class="social-link"
        >
          <i class="ti ti-brand-linkedin"></i>
          <span>LinkedIn</span>
        </a>
        <a href="https://www.instagram.com/" class="social-link">
          <i class="ti ti-brand-instagram"></i>
          <span>Instagram</span>
        </a>
      </div>
    </div>
  </body>
</html>
