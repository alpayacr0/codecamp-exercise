<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Playing Cards</title>
  </head>

  <body>
    <main id="playing-cards">
      <div class="card">
        <div class="left">
          <div>10</div>
          <div>♠</div>
        </div>
        <div class="middle">
          <div class="middle-section">
            <div>♠</div>
            <div>♠</div>
            <div>♠</div>
            <div>♠</div>
            <div>♠</div>
          </div>
          <div class="middle-section flipped">
            <div>♠</div>
            <div>♠</div>
            <div>♠</div>
            <div>♠</div>
            <div>♠</div>
          </div>
        </div>
        <div class="right">
          <div class="flipped">♠</div>
          <div class="flipped">10</div>
        </div>
      </div>
      <div class="card">
        <div class="left">
          <div>J</div>
          <div>♠</div>
        </div>
        <div class="middle">
          <div>♠</div>
        </div>
        <div class="right">
          <div class="flipped">♠</div>
          <div class="flipped">J</div>
        </div>
      </div>
      <div class="card">
        <div class="left">
          <div>Q</div>
          <div>♠</div>
        </div>
        <div class="middle">
          <div>♠</div>
        </div>
        <div class="right">
          <div class="flipped">♠</div>
          <div class="flipped">Q</div>
        </div>
      </div>
      <div class="card">
        <div class="left">
          <div>K</div>
          <div>♠</div>
        </div>
        <div class="middle">
          <div>♠</div>
        </div>
        <div class="right">
          <div class="flipped">♠</div>
          <div class="flipped">K</div>
        </div>
      </div>
      <div class="card">
        <div class="left">
          <div>A</div>
          <div>♠</div>
        </div>
        <div class="middle">
          <div>♠</div>
        </div>
        <div class="right">
          <div class="flipped">♠</div>
          <div class="flipped">A</div>
        </div>
      </div>
    </main>
  </body>
</html>
